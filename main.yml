name: Deploy
on:
  push:
    branches:
      - main
jobs:
  deploy:
    name: "SSH & Git & Composer & Migrations"
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh/
          echo "$SSH_KEY" > ~/.ssh/production.key
          chmod 600 ~/.ssh/production.key
          cat >>~/.ssh/config <<END
          Host production
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/production.key
            StrictHostKeyChecking no
          END
        env:
          SSH_USER: ${{ secrets.PROD_SSH_USER }}
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}

      - name: Check for changes
        run: ssh production 'cd ${{ vars.PROD_DOC_ROOT }} && git status'

      - name: Pull changes
        run: ssh production 'cd ${{ vars.PROD_DOC_ROOT }} && git pull origin main'

      - name: Install Composer packages
        run: ssh production 'cd ${{ vars.PROD_DOC_ROOT }} && /opt/php81/bin/php /usr/local/bin/composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader'

      - name: Run migrations
        run: ssh production 'cd ${{ vars.PROD_DOC_ROOT }} && /opt/php81/bin/php artisan migrate --force'

      - name: Set directory user
        run: ssh production 'cd ${{ vars.PROD_DOC_ROOT }} && chown -R www-root:www-root ./'
